<!doctype html>
<html lang="{{ site.lang | default: 'ko-KR' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#282a36" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#191a21" media="(prefers-color-scheme: dark)">
    {% seo %}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
    {% if page.layout == "home" %}
      <link rel="preload" as="image" href="{{ '/assets/images/home-hero-poster.jpg' | relative_url }}">
    {% endif %}
    <script>
      (function () {
        try {
          var storedTheme = localStorage.getItem("site-theme");
          var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.dataset.theme = storedTheme || (prefersDark ? "dark" : "light");
        } catch (error) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  </head>
  <body class="layout-{{ page.layout | default: 'default' }}">
    <div class="ide-frame">
      {% include header.html %}
      <div class="ide-frame__workspace">
        <aside class="ide-frame__rail ide-frame__rail--left" aria-hidden="true">
          <span class="ide-frame__rail-mark"></span>
          <span>PROJECT</span>
        </aside>
        <div class="ide-frame__canvas">
          <main id="content">
            {{ content }}
          </main>
          {% include footer.html %}
        </div>
        <aside class="ide-frame__rail ide-frame__rail--right" aria-hidden="true">
          <span class="ide-frame__rail-mark"></span>
          <span>STRUCTURE</span>
        </aside>
      </div>
      <div class="ide-frame__status" aria-hidden="true">
        <span class="ide-frame__branch"><span></span> main</span>
        <span class="ide-frame__status-spacer"></span>
        <span>UTF-8</span>
        <span>LF</span>
        <span>2 spaces</span>
        <span>KO</span>
      </div>
    </div>
    <script src="{{ '/assets/js/main.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
  </body>
</html>
